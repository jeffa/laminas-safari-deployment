name: Build and publish Laminas application image

on:
  workflow_dispatch:
    inputs:
      source_archive_url:
        description: Short-lived URL for the ignored Laminas source archive
        required: true
        type: string
      source_archive_sha256:
        description: SHA-256 checksum of the source archive
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::767397722370:role/GitHubActionsLaminasEcrPublisher
  ECR_REGISTRY: 767397722370.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: laminas-safari

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v6

      - name: Download and verify source archive
        env:
          SOURCE_ARCHIVE_URL: ${{ inputs.source_archive_url }}
          SOURCE_ARCHIVE_SHA256: ${{ inputs.source_archive_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_ARCHIVE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          archive="$RUNNER_TEMP/laminas-app.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" "$SOURCE_ARCHIVE_URL"
          printf '%s  %s\n' "$SOURCE_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p app
          tar -xzf "$archive" -C app --strip-components=1
          test -f app/composer.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsLaminasEcrPublish

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish both application architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
