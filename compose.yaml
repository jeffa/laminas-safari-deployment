services:
  db:
    image: mariadb:10.6.28
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      APPLICATION_ENV: ${APPLICATION_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-1}
      APP_BASE_PATH: ${APP_BASE_PATH:-/}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_NAME: ${EMAIL_NAME:-}
      EMAIL_SERVER_NAME: ${EMAIL_SERVER_NAME:-}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      CORPORATE_EMAIL_ADDRESS: ${CORPORATE_EMAIL_ADDRESS:-}
      CORPORATE_EMAIL_NAME: ${CORPORATE_EMAIL_NAME:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    volumes:
      - ./runtime-config/local.php:/var/www/html/config/autoload/local.php:ro
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',80); exit($$s ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  db-data:

