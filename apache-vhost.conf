<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/html/public

    # Maintenance mode is enabled by creating /var/www/html/.maintenance.
    # The marker is outside the public document root and is therefore not
    # directly downloadable. The maintenance script returns HTTP 503.
    RewriteEngine On
    RewriteCond /var/www/html/.maintenance -f
    RewriteCond %{REQUEST_URI} !^/maintenance\.php$
    RewriteCond %{REQUEST_URI} !^/newsletter/
    RewriteRule ^ /maintenance.php [END]

    <Directory /var/www/html/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
